{% extends "base.html" %}

{% block title %}Inscription - Mes Recettes{% endblock %}
{% block content %}
<h1>Créer un compte</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">S'inscrire</button>
</form>
<p> 
    Déjà inscrit ?
    <a href="{% url 'connexion' %}">Se connecter</a>
</p>
{% endblock %}
