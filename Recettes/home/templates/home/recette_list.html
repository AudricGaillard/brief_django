<!-- Hériter les classes de "base.html" -->
{% extends 'base.html' %}

{% block title %}Accueil - Mes Recettes{% endblock %}

{% block content %}
<section class="min-h-[70vh] flex flex-col items-center justify-center text-center px-4 py-16">
    <!-- Titre de la page -->
    <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight text-green-800">
        Bienvenue sur <span class="text-green-600">Mes Recettes</span>
    </h1>

    <!-- Présentation du carnet -->
    <p class="text-lg text-gray-600 mt-4 max-w-xl">
        Découvrez nos recettes et planifiez vos repas.
    </p>

    <!-- Accès vers le catalogue -->
    <div class="mt-8">
        <a href="{% url 'catalogue' %}" class="inline-block px-6 py-3 bg-green-700 text-white font-semibold rounded-lg shadow hover:bg-green-800 transition">
            Voir toutes les recettes
        </a>
    </div>
</section>
{% endblock %}
